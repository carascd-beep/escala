{% extends "base.html" %}

{% block title %}Login - Escala Paróquia{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-church" style="font-size: 3rem; color: var(--primary-color);"></i>
                    <h2 class="mt-2">Paróquia São João Bosco</h2>
                    <p class="text-muted">Sistema de Escalas</p>
                </div>
                
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="/" class="text-muted small">Voltar para página inicial</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
